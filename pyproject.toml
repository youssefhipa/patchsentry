[project]
name = "patchsentry"
version = "1.0.0"
description = "Unsupervised industrial visual anomaly detection: PatchCore, conformal alarm thresholds, ONNX serving with micro-batching."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Youssef Hipa" }]
# Base dependencies are exactly what the serving container needs. PyTorch is deliberately absent:
# the service runs the exported ONNX graph, which keeps the image small and the attack surface low.
dependencies = [
    "numpy>=1.26,<3",
    "pillow>=10.3",
    "opencv-python-headless>=4.9",
    "faiss-cpu>=1.8",
    "onnxruntime>=1.18",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
train = [
    "torch>=2.3",
    "torchvision>=0.18",
    "onnx>=1.16",
    "onnxscript>=0.1",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "mlflow>=2.14",
    "matplotlib>=3.9",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-pyyaml>=6.0",
]

[project.scripts]
patchsentry-serve = "patchsentry.serving.__main__:main"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/patchsentry"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF", "PTH", "NPY"]
ignore = ["B008"] # FastAPI's Depends()/File() defaults are the documented idiom.

[tool.ruff.lint.isort]
known-first-party = ["patchsentry", "tests"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/patchsentry"]
ignore_missing_imports = true
# NumPy's generics add noise without catching real bugs at this level of the code.
disallow_any_generics = false

[tool.pytest.ini_options]
# Run the two groups separately (see the Makefile): FAISS and PyTorch cannot share a macOS process.
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra --strict-markers"
markers = ["slow: exercises torch models or ONNX export; takes more than a few seconds."]
